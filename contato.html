<section class="cartao">
  <h2>Entre em contato</h2>
  <p>
    Preencha o formulário para apresentar sua escola, empresa, indústria
    ou comunidade e demonstrar interesse no projeto EcoEscola.
  </p>

  <form>
    <label for="tipo">Tipo de organização:</label>
    <select id="tipo" name="tipo" required>
      <option value="">Selecione uma opção</option>
      <option value="escola">Escola</option>
      <option value="empresa">Empresa ou indústria</option>
      <option value="comunidade">Comunidade ou associação</option>
      <option value="outro">Outro</option>
    </select>

    <label for="organizacao">Nome da escola, empresa ou comunidade:</label>
    <input type="text" id="organizacao" name="organizacao" required>

    <label for="nome">Nome da pessoa responsável:</label>
    <input type="text" id="nome" name="nome" required>

    <label for="email">E-mail para contato:</label>
    <input type="email" id="email" name="email" required>

    <label for="telefone">Telefone:</label>
    <input type="tel" id="telefone" name="telefone">

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" name="cidade">

    <label for="interesse">Como gostaria de participar?</label>
    <select id="interesse" name="interesse" required>
      <option value="">Selecione uma opção</option>
      <option value="palestra">Receber uma atividade ou palestra</option>
      <option value="coleta">Conversar sobre pontos de coleta</option>
      <option value="parceria">Propor uma parceria</option>
      <option value="informacoes">Receber mais informações</option>
      <option value="outro">Outro interesse</option>
    </select>

    <label for="mensagem">Conte um pouco sobre o que precisa:</label>
    <textarea id="mensagem" name="mensagem" rows="5"></textarea>

    <button type="submit">Enviar cadastro</button>
  </form>
</section>
